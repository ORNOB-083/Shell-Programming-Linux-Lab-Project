<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecurePass GUI</title>

  <link href="https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

  <div class="bg-white shadow-2xl rounded-2xl w-full max-w-4xl p-8 space-y-8">

    <h1 class="text-4xl font-bold text-center text-gray-800">
      SecurePass
    </h1>

    <div class="border rounded-xl p-6 bg-gray-50">
      <h2 class="text-2xl font-semibold mb-4">Generate Password</h2>

      <div class="flex flex-col md:flex-row gap-4">
        <input type="number" id="length" placeholder="Password Length" class="input-field" />

        <input type="text" id="site" placeholder="Site Name" class="input-field" />

        <button id="generateBtn" class="btn btn-accent">
          Generate
        </button>
      </div>
    </div>

    <div class="border rounded-xl p-6 bg-gray-50">
      <h2 class="text-2xl font-semibold mb-4">View Passwords</h2>
      <button id="viewBtn" class="btn btn-primary">
        View All
      </button>
    </div>

    <div class="border rounded-xl p-6 bg-gray-50">
      <h2 class="text-2xl font-semibold mb-4">Search Password</h2>
      <div class="flex flex-col md:flex-row gap-4">
        <input type="text" id="searchSite" placeholder="Search Site" class="input-field" />
        <button id="searchBtn" class="btn btn-primary">Search</button>
      </div>
    </div>

    <div class="border rounded-xl p-6 bg-gray-50">
      <h2 class="text-2xl font-semibold mb-4">Delete Password</h2>
      <div class="flex flex-col md:flex-row gap-4">
        <input type="text" id="deleteSite" placeholder="Delete Site" class="input-field" />
        <button id="deleteBtn" class="btn btn-error">Delete</button>
      </div>
    </div>

    <div class="border rounded-xl p-6 bg-black text-green-400">
      <h2 class="text-2xl font-semibold mb-4 text-white">Output</h2>
      <pre id="output" class="whitespace-pre-wrap"></pre>
    </div>
  </div>

  <!-- Tailwind Custom Classes -->
  <style>
    .input-field {
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      width: 100%;
      outline: none;
    }

    .input-field:focus {
      box-shadow: 0 0 0 2px #60a5fa;
    }
  </style>

  <script src="renderer.js"></script>
</body>

</html>
